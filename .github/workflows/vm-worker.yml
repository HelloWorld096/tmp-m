name: On-Demand Remote VM

# Dispatched by the Worker (POST .../actions/workflows/vm-worker.yml/dispatches).
# There is deliberately NO input: the Worker address comes from the repository
# variable VM_BASE_URL, so nobody who can merely dispatch this workflow can
# redirect VM_WEBHOOK_SECRET to a server of their choosing.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # only for the "second VM" guard below: list this workflow's runs

# One VM at a time, and NOTHING is ever queued. There is deliberately no `concurrency:` group, because a
# group parks every extra run as a pending one. Instead the first step below makes a duplicate run exit
# immediately, and the Worker does not dispatch while a run is active or starting. A VM whose agent or
# tunnel has died ends its own run (see vm-runner/keepalive.sh), which frees the slot for the next start.

env:
  VM_BASE_URL: ${{ vars.VM_BASE_URL }}   # e.g. https://remote-linux-vm.<account>.workers.dev
  CLOUDFLARED_VERSION: "2026.10.1"
  CLOUDFLARED_SHA256: "200573c872174ab449965655febadef8edfbb144ebcaa391b700b2dedbadb3cd"

jobs:
  vm:
    runs-on: ubuntu-24.04          # pinned: "latest" would change the OS and Python underneath the lockfile
    # VM_WEBHOOK_SECRET lives in this Environment (not as a repository secret), and the Environment only
    # accepts runs from `main`. A run dispatched on any other branch - e.g. a stale branch with an older
    # copy of this workflow - therefore cannot read it. Create it once: see docs/MIGRATION.md step 4.
    environment: remote-vm
    # 360 min (6 h) is the most GitHub allows for a job on a hosted runner; a larger value would be cut off
    # at 6 h anyway. keepalive.sh also ends the VM at 6 h (VM_MAX_SECONDS) counted from the first step, so
    # the two limits coincide and whichever fires first (usually GitHub's, by a few seconds) ends the run.
    timeout-minutes: 360
    steps:
      # First step, before anything is claimed: a live VM's session is never touched by a rejected duplicate.
      # The Worker already refuses to dispatch while a run is active; this covers a run started by hand and
      # two runs that start together. The run with the lowest id wins, so they cannot both give up.
      - name: Refuse to start a second VM
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          older=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/vm-worker.yml/runs?per_page=30" \
            --jq "[.workflow_runs[] | select(.status != \"completed\" and .id < ${GITHUB_RUN_ID})] | length")
          if [ "${older}" != "0" ]; then
            echo "::error::Another run of this workflow is already queued or running. Only one VM exists at a time and nothing is queued, so this run stops."
            exit 1
          fi

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          # keepalive.sh counts the 6-hour lifetime from here, not from when it starts.
          date +%s > /tmp/vm-started
          if [[ ! "${VM_BASE_URL:-}" =~ ^https://[A-Za-z0-9.-]+$ ]]; then
            echo "Repository variable VM_BASE_URL must be an https origin with no path, e.g. https://name.account.workers.dev"
            exit 1
          fi

      # Pinned to a commit (v6.0.3). persist-credentials: false keeps the
      # GITHUB_TOKEN out of .git/config, where any command could read it.
      - name: Checkout infrastructure repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/vm-venv
          # requirements.txt is fully resolved and hash-locked: any package that differs from what was reviewed fails the install.
          /tmp/vm-venv/bin/pip install --no-cache-dir --require-hashes --no-deps -r .github/vm-runner/requirements.txt
          curl -fsSL "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-amd64.deb" -o /tmp/cloudflared.deb
          echo "${CLOUDFLARED_SHA256}  /tmp/cloudflared.deb" | sha256sum --check --strict -
          sudo dpkg -i /tmp/cloudflared.deb
          # Copy the agent out of the workspace so commands can't alter the running copy's source.
          install -m 0644 .github/vm-runner/agent.py /tmp/vm-agent.py
          # The session modules must sit next to the agent: it imports them by name, and a session cannot work without them.
          for m in vm_session vm_container vm_snapshot; do
            install -m 0644 ".github/vm-runner/${m}.py" "/tmp/${m}.py"
          done
          install -m 0755 .github/vm-runner/keepalive.sh /tmp/vm-keepalive.sh
          # Install the reviewed Relay script outside the mutable workspace. Every fresh VM gets
          # this pinned, checksummed copy at a fixed path before the authenticated agent starts. That is integrity
          # at install time, not a boundary against code running on the VM (the runner user has passwordless sudo).
          sudo install -d -o root -g root -m 0755 /opt/relay
          sudo install -o root -g root -m 0755 .github/vm-runner/relay.sh /opt/relay/relay.sh
          echo "39616e17497f37f9325917b30c3c89acc0d42fdb7926627692a8286cb44a9e82  /opt/relay/relay.sh" | sha256sum --check --strict -

      - name: Obtain session token
        id: session
        shell: bash
        env:
          VM_WEBHOOK_SECRET: ${{ secrets.VM_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          # The secret goes via curl's config on stdin, not argv (argv is world-readable in /proc).
          # The whole claim response (runner token and, for a persistent session, a short-lived token for that
          # session's private repository) is kept in a 0600 file that only the agent reads, once, on its stdin.
          printf 'header = "Authorization: Bearer %s"\n' "$VM_WEBHOOK_SECRET" \
            | curl -fsS --connect-timeout 5 --max-time 15 -X POST -K - "${VM_BASE_URL}/runner/claim" > /tmp/vm-claim.json
          # Mask every secret value BEFORE anything can print it, then expose only the runner token as a step output.
          python3 - <<'PY' > /tmp/vm-claim.masks
          import json
          d = json.load(open("/tmp/vm-claim.json"))
          vals = [d.get("token")]
          s = d.get("session") or {}
          vals.append(s.get("repo_token"))
          for v in vals:
              if isinstance(v, str) and v:
                  print(v)
          PY
          if [ ! -s /tmp/vm-claim.masks ]; then echo "Could not obtain session token."; rm -f /tmp/vm-claim.json /tmp/vm-claim.masks; exit 1; fi
          while IFS= read -r v; do echo "::add-mask::$v"; done < /tmp/vm-claim.masks
          TOKEN=$(head -n 1 /tmp/vm-claim.masks)
          rm -f /tmp/vm-claim.masks
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          if python3 -c 'import json,sys; sys.exit(0 if json.load(open("/tmp/vm-claim.json")).get("session") else 1)'; then
            echo "This run was claimed for a persistent session."
          fi

      - name: Start command server
        shell: bash
        run: |
          set -euo pipefail
          # Scratch space for snapshot staging (chunks are built here, never in the container). Prefer the large
          # /mnt temp disk; fall back to /tmp.
          SCRATCH=/tmp/vm-scratch
          if [ -d /mnt ] && sudo mkdir -p /mnt/vm-scratch 2>/dev/null; then
            sudo chown "$(id -u):$(id -g)" /mnt/vm-scratch
            SCRATCH=/mnt/vm-scratch
          else
            mkdir -p "$SCRATCH"
          fi
          chmod 700 "$SCRATCH"
          export VM_SNAPSHOT_SCRATCH="$SCRATCH"
          # The claim bundle is handed over on stdin (the agent also scrubs its children's environment). The file is
          # unlinked right after the shell has opened it: the agent keeps reading through its descriptor, and no
          # later command on this VM can find the repository token on disk.
          /tmp/vm-venv/bin/python /tmp/vm-agent.py < /tmp/vm-claim.json > /tmp/agent.log 2>&1 &
          echo $! > /tmp/agent.pid
          rm -f /tmp/vm-claim.json
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null 2>&1; then echo "Command server is ready."; exit 0; fi
            sleep 1
          done
          echo "Command server failed to start."
          cat /tmp/agent.log
          exit 1

      # Separate step with no token in its environment: cloudflared must not inherit it.
      - name: Start tunnel
        shell: bash
        run: |
          set -euo pipefail
          cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8000 > /tmp/tunnel.log 2>&1 &
          echo $! > /tmp/tunnel.pid
          TUNNEL_URL=""
          for i in $(seq 1 40); do
            # cloudflared also prints https://api.trycloudflare.com (Cloudflare's own API) in error lines; that is never our tunnel.
            TUNNEL_URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/tunnel.log | grep -v -x 'https://api\.trycloudflare\.com' | head -n 1 || true)
            if [ -n "$TUNNEL_URL" ]; then break; fi
            sleep 2
          done
          if [ -z "$TUNNEL_URL" ]; then echo "Tunnel startup failed."; cat /tmp/tunnel.log; exit 1; fi
          echo "$TUNNEL_URL" > /tmp/tunnel-url

      - name: Register runner
        shell: bash
        env:
          SESSION_TOKEN: ${{ steps.session.outputs.token }}
        run: |
          set -euo pipefail
          export TUNNEL_URL="$(cat /tmp/tunnel-url)"
          python3 - <<'PY' > /tmp/register.json
          import json, os
          print(json.dumps({"tunnelUrl": os.environ["TUNNEL_URL"], "token": os.environ["SESSION_TOKEN"]}))
          PY
          chmod 600 /tmp/register.json
          STATUS=$(curl -sS -o /tmp/register-response -w '%{http_code}' --connect-timeout 5 --max-time 15 \
            -X POST "${VM_BASE_URL}/runner/register" -H "Content-Type: application/json" --data-binary @/tmp/register.json)
          rm -f /tmp/register.json
          if [ "$STATUS" != "200" ]; then
            echo "Runner registration failed with HTTP $STATUS."
            exit 1
          fi
          rm -f /tmp/register-response
          echo "Runner registered successfully."

      # Ends when the VM has been idle for 60 minutes, when it has been up for 6 hours (always, even
      # mid-job), or when its agent/tunnel is dead (so a replacement
      # run is not stuck behind this one). The agent touches /tmp/vm-activity on every authenticated request
      # and every 10 s while a job runs; mtime is read, never contents. Logic and tests: vm-runner/keepalive.sh.
      - name: Keep runner alive until idle
        shell: bash
        run: /tmp/vm-keepalive.sh
